name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
        - name: Check out the repository
        uses: actions/checkout@v4

        - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

        - name: Install dependencies
        run: pip install -r app/requirements.txt

        - name: Run tests
        run: pytest tests/

        - name: Build Docker image
        run: docker build -t beginner-devops-api .

        - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

        - name: Tag and push image
        if: github.event_name == 'push'
        run: |
          docker tag beginner-devops-api ghcr.io/${{ github.repository_owner }}/beginner-devops-
        api:latest
          docker push ghcr.io/${{ github.repository_owner }}/beginner-devops-api:latest
